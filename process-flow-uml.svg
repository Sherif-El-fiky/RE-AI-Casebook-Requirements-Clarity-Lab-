<svg width="680" height="710" viewBox="0 0 680 710" xmlns="http://www.w3.org/2000/svg" role="img">
<title>UML activity diagram of the AI-assisted requirements engineering process</title>
<desc>Standard UML activity diagram notation: an initial node leads through activities for capturing stakeholder input, running an AI-assisted ambiguity scan, and applying RE review and judgment, into a decision node with guard conditions splitting into finalizing a requirement or flagging an open item, each ending in an activity final node.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#2C2C2A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="710" fill="#ffffff"/>

<circle cx="340" cy="30" r="8" fill="#2C2C2A"/>
<line x1="340" y1="38" x2="340" y2="88" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="180" y="98" width="320" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="120" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Capture raw stakeholder notes</text>
<line x1="340" y1="142" x2="340" y2="192" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="180" y="202" width="320" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="224" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Run AI-assisted ambiguity scan</text>
<line x1="340" y1="246" x2="340" y2="296" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="180" y="306" width="320" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="328" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Apply RE review &amp; judgment</text>
<line x1="340" y1="350" x2="340" y2="400" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<polygon points="340,410 460,455 340,500 220,455" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="455" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Testable &amp; unambiguous?</text>

<line x1="220" y1="455" x2="220" y2="550" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="460" y1="455" x2="460" y2="550" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="205" y="500" text-anchor="end" font-family="sans-serif" font-size="12" fill="#444441">[clear &amp; testable]</text>
<text x="475" y="500" text-anchor="start" font-family="sans-serif" font-size="12" fill="#444441">[gaps remain]</text>

<rect x="110" y="560" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="220" y="582" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Finalize requirement</text>

<rect x="350" y="560" width="220" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="460" y="582" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Flag as open item</text>

<line x1="220" y1="604" x2="220" y2="644" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="460" y1="604" x2="460" y2="644" stroke="#2C2C2A" stroke-width="1.5" marker-end="url(#arrow)"/>

<circle cx="220" cy="654" r="10" fill="none" stroke="#2C2C2A" stroke-width="1.5"/>
<circle cx="220" cy="654" r="5" fill="#2C2C2A"/>
<circle cx="460" cy="654" r="10" fill="none" stroke="#2C2C2A" stroke-width="1.5"/>
<circle cx="460" cy="654" r="5" fill="#2C2C2A"/>

<text x="460" y="684" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#444441">&#8635; feeds next stakeholder workshop</text>
</svg>
